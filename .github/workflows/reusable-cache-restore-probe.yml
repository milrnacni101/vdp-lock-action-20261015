name: Reusable cache restore probe
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Restore cache under test
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: reusable-cache-secret.txt
          key: owned-reusable-cache-isolation-20261017-7d91
      - name: Record result without exposing contents
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        run: |
          echo "cache_hit=${CACHE_HIT}" > cache-result.txt
          if [ -f reusable-cache-secret.txt ]; then
            echo "file_present=true" >> cache-result.txt
            echo "sha256=$(sha256sum reusable-cache-secret.txt | cut -d' ' -f1)" >> cache-result.txt
          else
            echo "file_present=false" >> cache-result.txt
            echo "sha256=" >> cache-result.txt
          fi
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: reusable-cache-result
          path: cache-result.txt
          retention-days: 1
