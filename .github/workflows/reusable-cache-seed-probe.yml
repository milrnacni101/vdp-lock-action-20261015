name: Reusable cache seed probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Create synthetic callee-only cache entry
        run: printf '%s\n' 'OWNED_CALLEE_ONLY_CACHE_MARKER_20261017_7D91' > reusable-cache-secret.txt
      - name: Save synthetic cache
        uses: actions/cache/save@v4
        with:
          path: reusable-cache-secret.txt
          key: owned-reusable-cache-isolation-20261017-7d91
