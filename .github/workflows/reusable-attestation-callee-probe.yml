name: Reusable attestation callee identity probe
on:
  workflow_call:
permissions:
  attestations: write
  id-token: write
  contents: read
jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Create synthetic subject
        run: printf %s 'OWNED_REUSABLE_ATTESTATION_SUBJECT_20261017' > reusable-attestation-subject.txt
      - name: Attest synthetic subject
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: reusable-attestation-subject.txt
