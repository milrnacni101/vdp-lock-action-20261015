name: Artifact isolation reader
on:
  workflow_call:
    inputs:
      run_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  read-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact from callee repository
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: callee-private-artifact
          repository: milrnacni101/vdp-lock-action-20261015
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: downloaded
      - name: Record non-secret result
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: |
          target=downloaded/callee-artifact-secret.txt
          printf 'download_outcome=%s\n' "$DOWNLOAD_OUTCOME" > artifact-result.txt
          if [ -f "$target" ]; then
            printf 'file_present=true\n' >> artifact-result.txt
            printf 'length=%s\n' "$(wc -c < "$target")" >> artifact-result.txt
            printf 'sha256=%s\n' "$(sha256sum "$target" | cut -d' ' -f1)" >> artifact-result.txt
          else
            printf 'file_present=false\nlength=0\nsha256=\n' >> artifact-result.txt
          fi
          printf 'repository=%s\n' "${{ github.repository }}" >> artifact-result.txt
      - name: Upload access result
        uses: actions/upload-artifact@v4
        with:
          name: artifact-access-result
          path: artifact-result.txt
          retention-days: 1
