name: Artifact isolation producer
on:
  workflow_dispatch:
permissions: {}
jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: Create synthetic callee artifact
        run: printf %s 'OWNED_CALLEE_ARTIFACT_SECRET_20261017_C7F29A' > callee-artifact-secret.txt
      - name: Upload synthetic callee artifact
        uses: actions/upload-artifact@v4
        with:
          name: callee-private-artifact
          path: callee-artifact-secret.txt
          retention-days: 1
